name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy to Clojars
    runs-on: ubuntu-latest
    container:
      image: clojure:tools-deps-trixie-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Derive version from tag
        run: echo "PROJECT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Lint with clj-kondo
        run: clojure -M:lint
      - name: Run tests
        run: clojure -M:test/unit
      - name: Check whether version is already published
        id: published
        run: |
          POM_URL="https://repo.clojars.org/org/clojars/rodriguesgot/identika/${PROJECT_VERSION}/identika-${PROJECT_VERSION}.pom"
          if python3 -c "import urllib.request, sys; urllib.request.urlopen(sys.argv[1])" "$POM_URL" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PROJECT_VERSION} is already on Clojars — skipping deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Clojars
        if: steps.published.outputs.skip != 'true'
        run: clojure -T:build deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
